# Whole stack in containers: `docker compose -f docker-compose.full.yml up --build`
# Reads secrets from .env (see .env.example). Public URLs default to localhost.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: aix, POSTGRES_PASSWORD: aix, POSTGRES_DB: aix }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aix"], interval: 5s, retries: 20 }
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
  migrate:
    build: { context: ., target: migrate }
    environment: { DATABASE_URL: postgres://aix:aix@postgres:5432/aix }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., target: api }
    env_file: [{ path: .env, required: false }]
    environment:
      NODE_ENV: ${AIX_NODE_ENV:-development}
      DATABASE_URL: postgres://aix:aix@postgres:5432/aix
      SMTP_URL: smtp://mailpit:1025
      AIX_STORAGE_DIR: /data
      AIX_WEB_URL: ${AIX_WEB_URL:-http://localhost:3000}
      AIX_API_URL: ${AIX_API_URL:-http://localhost:4000}
      AIX_GATEWAY_URL: ${AIX_GATEWAY_URL:-http://localhost:4100}
    volumes: [storage:/data]
    ports: ["4000:4000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  gateway:
    build: { context: ., target: gateway }
    environment:
      AIX_API_URL: ${AIX_API_URL:-http://localhost:4000}
      AIX_GATEWAY_URL: ${AIX_GATEWAY_URL:-http://localhost:4100}
    ports: ["4100:4100"]
    depends_on: [api]
  web:
    build: { context: ., target: web, args: { AIX_API_URL: http://api:4000 } }
    environment: { AIX_API_URL: http://api:4000 }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  storage:
